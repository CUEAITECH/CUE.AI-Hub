name: PR-Agent Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR-Agent Review
        uses: Codium-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 使用标准 OpenAI API（gpt-5.4-mini 做 review，成本低）
          CONFIG.MODEL: gpt-5.4-mini
          CONFIG.AI_PROVIDER: openai
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
          github_action_config.auto_describe: "true"

      - name: Notify Hub (sink)
        if: always()
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found, skipping Hub notification"
            exit 0
          fi
          curl -sf -X POST "${{ secrets.CUE_HUB_URL }}/api/webhooks/pr-agent" \
            -H "Content-Type: application/json" \
            -H "X-CUE-API-Key: ${{ secrets.CUE_API_KEY }}" \
            -d "{\"event\":\"pr_agent_review\",\"repo\":\"${{ github.repository }}\",\"pr_number\":${PR_NUMBER},\"run_id\":\"${{ github.run_id }}\"}" \
            || echo "Hub notification failed (non-fatal)"
